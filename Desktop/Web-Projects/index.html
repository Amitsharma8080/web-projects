<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Tasks</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Light theme (default) ── */
    :root {
      --bg:        #f5f0e8;
      --surface:   #fffdf8;
      --surface2:  #f0ebe0;
      --ink:       #1c1917;
      --muted:     #78716c;
      --accent:    #c2410c;
      --done:      #a8a29e;
      --border:    #e7e0d5;
      --shadow:    0 2px 16px rgba(28,25,23,.08);
      --grid-line: rgba(28,25,23,.04);
      --del-hover-bg: #fee2e2;
      --del-hover-fg: #dc2626;
    }

    /* ── Dark theme ── */
    [data-theme="dark"] {
      --bg:        #18181b;
      --surface:   #27272a;
      --surface2:  #3f3f46;
      --ink:       #fafaf9;
      --muted:     #a1a1aa;
      --accent:    #f97316;
      --done:      #71717a;
      --border:    #3f3f46;
      --shadow:    0 2px 20px rgba(0,0,0,.35);
      --grid-line: rgba(255,255,255,.03);
      --del-hover-bg: #3f1212;
      --del-hover-fg: #f87171;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px 16px 80px;
      transition: background .3s, color .3s;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none; z-index: 0;
    }

    .card {
      position: relative; z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow), 0 0 0 4px rgba(194,65,12,.06);
      width: 100%; max-width: 580px;
      padding: 44px 40px 40px;
      animation: rise .5s cubic-bezier(.16,1,.3,1) both;
      transition: background .3s, border-color .3s, box-shadow .3s;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 32px;
      gap: 12px;
    }
    .header-left h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem; font-weight: 700;
      letter-spacing: -.5px; line-height: 1.1;
    }
    .header-left h1 span { color: var(--accent); }
    .stats {
      margin-top: 8px; font-size: .82rem;
      font-weight: 300; color: var(--muted); letter-spacing: .4px;
    }

    /* Dark mode toggle */
    .toggle-label {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; user-select: none;
      margin-top: 8px;
    }
    .toggle-icon { font-size: 1rem; }
    .dark-toggle {
      flex-shrink: 0;
      width: 44px; height: 24px;
      background: var(--border);
      border: none; border-radius: 999px;
      cursor: pointer; position: relative;
      transition: background .25s;
    }
    .dark-toggle::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
      transition: transform .25s, background .25s;
    }
    [data-theme="dark"] .dark-toggle { background: var(--accent); }
    [data-theme="dark"] .dark-toggle::after { transform: translateX(20px); }

    /* ── Input section ── */
    .input-section { margin-bottom: 28px; }
    .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .input-row input[type="text"] {
      flex: 1; padding: 13px 18px;
      border: 1.5px solid var(--border); border-radius: 12px;
      background: var(--bg); font-family: 'DM Sans', sans-serif;
      font-size: .95rem; color: var(--ink); outline: none;
      transition: border-color .2s, box-shadow .2s, background .3s, color .3s;
    }
    .input-row input[type="text"]::placeholder { color: var(--done); }
    .input-row input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(194,65,12,.12);
    }
    .btn-add {
      padding: 13px 20px; background: var(--accent); color: #fff;
      border: none; border-radius: 12px;
      font-family: 'DM Sans', sans-serif; font-size: 1.25rem;
      font-weight: 500; cursor: pointer;
      transition: filter .2s, transform .1s; line-height: 1;
    }
    .btn-add:hover  { filter: brightness(1.12); }
    .btn-add:active { transform: scale(.96); }

    /* Extra fields row */
    .extra-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .extra-row input[type="date"] {
      flex: 1; min-width: 140px;
      padding: 9px 12px;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: var(--bg); font-family: 'DM Sans', sans-serif;
      font-size: .85rem; color: var(--ink); outline: none;
      transition: border-color .2s, background .3s, color .3s;
      color-scheme: light dark;
    }
    .extra-row input[type="date"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(194,65,12,.1);
    }
    .select-wrap { flex: 1; min-width: 140px; position: relative; }
    .select-wrap::after {
      content: '▾'; position: absolute; right: 11px;
      top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none; font-size: .8rem;
    }
    .select-wrap select {
      width: 100%; padding: 9px 28px 9px 12px;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: var(--bg); font-family: 'DM Sans', sans-serif;
      font-size: .85rem; color: var(--ink); outline: none;
      cursor: pointer; appearance: none; -webkit-appearance: none;
      transition: border-color .2s, background .3s, color .3s;
    }
    .select-wrap select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(194,65,12,.1);
    }

    /* ── Filters ── */
    .filters { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-btn {
      padding: 5px 14px;
      border: 1.5px solid var(--border); border-radius: 999px;
      background: transparent; font-family: 'DM Sans', sans-serif;
      font-size: .8rem; font-weight: 500; color: var(--muted);
      cursor: pointer; transition: all .18s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Task list ── */
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

    .task-item {
      display: grid;
      grid-template-columns: 22px 1fr auto;
      grid-template-rows: auto auto;
      column-gap: 12px; row-gap: 5px;
      padding: 13px 14px 13px 16px;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 12px;
      transition: border-color .2s, opacity .25s, background .3s;
      animation: slideIn .3s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .task-item:hover { border-color: var(--surface2); }
    .task-item.done  { opacity: .55; }

    /* priority left-border */
    .task-item[data-priority="high"]   { border-left: 4px solid #ef4444; }
    .task-item[data-priority="medium"] { border-left: 4px solid #f59e0b; }
    .task-item[data-priority="low"]    { border-left: 4px solid #22c55e; }

    /* Custom checkbox */
    .check-wrap {
      grid-column: 1; grid-row: 1 / 3; align-self: center;
      position: relative; width: 22px; height: 22px;
    }
    .check-wrap input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .check-box {
      width: 22px; height: 22px; border: 2px solid var(--border);
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .2s, border-color .2s;
      background: var(--surface);
    }
    .check-wrap input:checked + .check-box { background: var(--accent); border-color: var(--accent); }
    .check-box svg { display: none; }
    .check-wrap input:checked + .check-box svg { display: block; }

    /* Task text */
    .task-text {
      grid-column: 2; grid-row: 1; align-self: center;
      font-size: .95rem; font-weight: 400; word-break: break-word;
      transition: color .2s, text-decoration .2s;
    }
    .task-item.done .task-text { text-decoration: line-through; color: var(--done); }

    /* Meta row */
    .task-meta {
      grid-column: 2; grid-row: 2;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .priority-badge {
      font-size: .68rem; font-weight: 600; letter-spacing: .5px;
      padding: 2px 8px; border-radius: 999px; text-transform: uppercase;
    }
    .priority-badge.high   { background: #fef2f2; color: #ef4444; }
    .priority-badge.medium { background: #fffbeb; color: #d97706; }
    .priority-badge.low    { background: #f0fdf4; color: #16a34a; }
    [data-theme="dark"] .priority-badge.high   { background: #3f1212; color: #f87171; }
    [data-theme="dark"] .priority-badge.medium { background: #3a2505; color: #fbbf24; }
    [data-theme="dark"] .priority-badge.low    { background: #0a2e14; color: #4ade80; }

    .due-date {
      font-size: .75rem; color: var(--muted);
      display: flex; align-items: center; gap: 4px;
    }
    .due-date.overdue { color: #ef4444; font-weight: 500; }

    /* Delete button */
    .btn-del {
      grid-column: 3; grid-row: 1 / 3; align-self: center;
      width: 30px; height: 30px; border: none;
      background: transparent; border-radius: 8px; color: var(--done);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .18s, color .18s; opacity: 0;
    }
    .task-item:hover .btn-del { opacity: 1; }
    .btn-del:hover { background: var(--del-hover-bg); color: var(--del-hover-fg); }

    /* Empty state */
    .empty {
      text-align: center; padding: 40px 0 20px;
      color: var(--muted); font-size: .9rem; font-weight: 300;
    }
    .empty .emoji { font-size: 2rem; display: block; margin-bottom: 10px; }

    /* Footer */
    .footer { margin-top: 24px; display: flex; justify-content: flex-end; }
    .btn-clear {
      background: none; border: none;
      font-family: 'DM Sans', sans-serif; font-size: .8rem;
      color: var(--muted); cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px;
      transition: color .18s;
    }
    .btn-clear:hover { color: var(--accent); }
    .btn-clear:disabled { opacity: .35; pointer-events: none; }

    @media (max-width: 480px) {
      .card { padding: 32px 20px 28px; }
      .header-left h1 { font-size: 1.9rem; }
    }
  </style>
</head>
<body>
<div class="card">

  <div class="header">
    <div class="header-left">
      <h1>My <span>Tasks.</span></h1>
      <p class="stats" id="stats">0 tasks remaining</p>
    </div>
    <label class="toggle-label" title="Toggle dark mode">
      <span class="toggle-icon" id="theme-icon">🌙</span>
      <button class="dark-toggle" id="dark-toggle" aria-label="Toggle dark mode"></button>
    </label>
  </div>

  <div class="input-section">
    <div class="input-row">
      <input type="text" id="task-input" placeholder="Add a new task…" maxlength="140" autocomplete="off"/>
      <button class="btn-add" id="add-btn" title="Add task">+</button>
    </div>
    <div class="extra-row">
      <input type="date" id="due-input" title="Due date"/>
      <div class="select-wrap">
        <select id="priority-input" aria-label="Priority">
          <option value="medium">⚡ Medium</option>
          <option value="high">🔴 High</option>
          <option value="low">🟢 Low</option>
        </select>
      </div>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="done">Done</button>
    <button class="filter-btn" data-filter="high">🔴 High</button>
    <button class="filter-btn" data-filter="medium">⚡ Medium</button>
    <button class="filter-btn" data-filter="low">🟢 Low</button>
  </div>

  <ul class="task-list" id="task-list"></ul>

  <div class="footer">
    <button class="btn-clear" id="clear-btn">Clear completed</button>
  </div>
</div>

<script>
  // ── Storage keys ──
  const STORAGE_KEY = 'mytasks_v2';
  const THEME_KEY   = 'mytasks_theme';

  // ── State ──
  let tasks         = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let currentFilter = 'all';

  // ── DOM refs ──
  const listEl     = document.getElementById('task-list');
  const inputEl    = document.getElementById('task-input');
  const dueEl      = document.getElementById('due-input');
  const priorityEl = document.getElementById('priority-input');
  const addBtn     = document.getElementById('add-btn');
  const statsEl    = document.getElementById('stats');
  const clearBtn   = document.getElementById('clear-btn');
  const darkToggle = document.getElementById('dark-toggle');
  const themeIcon  = document.getElementById('theme-icon');

  // ── Dark mode ──
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
    localStorage.setItem(THEME_KEY, theme);
  }
  applyTheme(localStorage.getItem(THEME_KEY) || 'light');

  darkToggle.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  // ── Persist ──
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  // ── Helpers ──
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function isOverdue(iso) {
    if (!iso) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    return new Date(iso) < today;
  }

  // ── Render ──
  function render() {
    const filtered = tasks.filter(t => {
      if (currentFilter === 'active') return !t.done;
      if (currentFilter === 'done')   return  t.done;
      if (['high','medium','low'].includes(currentFilter)) return t.priority === currentFilter;
      return true;
    });

    listEl.innerHTML = '';

    if (filtered.length === 0) {
      listEl.innerHTML = `
        <div class="empty">
          <span class="emoji">${currentFilter === 'done' ? '🎉' : '✏️'}</span>
          ${currentFilter === 'done' ? 'No completed tasks yet.' : 'Nothing here — add a task above!'}
        </div>`;
    } else {
      filtered.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.dataset.id = task.id;
        li.dataset.priority = task.priority || 'medium';

        const overdue = !task.done && isOverdue(task.due);
        const duePart = task.due
          ? `<span class="due-date ${overdue ? 'overdue' : ''}">
               📅 ${overdue ? 'Overdue · ' : ''}${formatDate(task.due)}
             </span>`
          : '';

        const p = task.priority || 'medium';
        const pLabel = p.charAt(0).toUpperCase() + p.slice(1);

        li.innerHTML = `
          <label class="check-wrap">
            <input type="checkbox" ${task.done ? 'checked' : ''} aria-label="Mark complete"/>
            <div class="check-box">
              <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
                <path d="M1 5l3.5 3.5L11 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </label>
          <span class="task-text">${escHtml(task.text)}</span>
          <div class="task-meta">
            <span class="priority-badge ${p}">${pLabel}</span>
            ${duePart}
          </div>
          <button class="btn-del" title="Delete task" aria-label="Delete">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>`;

        li.querySelector('input[type="checkbox"]').addEventListener('change', () => toggle(task.id));
        li.querySelector('.btn-del').addEventListener('click', () => remove(task.id));
        listEl.appendChild(li);
      });
    }

    const remaining = tasks.filter(t => !t.done).length;
    statsEl.textContent = `${remaining} task${remaining !== 1 ? 's' : ''} remaining`;
    clearBtn.disabled = !tasks.some(t => t.done);
  }

  // ── Add task ──
  function addTask() {
    const text = inputEl.value.trim();
    if (!text) { inputEl.focus(); return; }
    tasks.unshift({
      id:       Date.now(),
      text,
      done:     false,
      due:      dueEl.value || null,
      priority: priorityEl.value || 'medium'
    });
    inputEl.value    = '';
    dueEl.value      = '';
    priorityEl.value = 'medium';
    save(); render();
    inputEl.focus();
  }

  // ── Toggle done ──
  function toggle(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
    save(); render();
  }

  // ── Delete task ──
  function remove(id) {
    tasks = tasks.filter(t => t.id !== id);
    save(); render();
  }

  // ── Listeners ──
  addBtn.addEventListener('click', addTask);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  clearBtn.addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    save(); render();
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  render();
</script>
</body>
</html>
